[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget3d"
version = "1.0.0"
description = "Budget3D: Idol and Idol-turbo image-to-3D generation at any token budget (unofficial, open-source)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The tested, pinned environment is requirements.txt; Idol's own code comes from a checkout of
# https://github.com/speridlabs/idol-sdk (third_party/idol-sdk or IDOL_ROOT).

[tool.setuptools]
packages = ["budget3d"]
