# Budget3D-Idol-Turbo, phase 2 (10,000 -> 20,000 steps), continued from the phase-1 checkpoint (copy it to
# <out>/checkpoint-last.pth): a 200-step learning-rate re-warm, a new data seed, and the faster settings -- 2 per pass
# x 8 (same global batch 64), gradient checkpointing only where memory needs it, and the one-pass LoRA.
max_steps: 20000
batch_per_gpu: 2
grad_accum: 8
backbone_lr: 5.0e-5
adapter_mult: 6.0
warmup_steps: 300
min_lr_ratio: 0.2
weight_decay: 1.0e-4
grad_clip: 0.5
ema_decay: 0.9995
rollout_steps: 5
rescale_t: 3.0
grid_jitter: 0.15
k0_stay_p: 0.25
noise_layout_early_k: 2
cfg_dropout: 0.0
coarse_boost: 0.5
cam_weight: 0.2
feat_weight: 0.2
feat_cos_weight: 0.15
anchor_p: 0.12
uniform_coarse_p: 0.1
budget_p: 0.65
random_placement_p: 0.15
num_workers: 6
log_every: 20
save_every: 500
snapshot_every: 2500
ckpt_policy: auto
rewarm_steps: 200
seed: 1
lora_fused: 1
