# Budget3D-Idol-Turbo, phase 1 (0 -> 10,000 steps) from speridlabs/idol-turbo: 5-step guidance-free teacher rollouts.
# Phase 2 (10,000 -> 20,000) is configs/idol_turbo_phase2.yaml.  Global batch 64 = 4 x 4 x 4 GPUs.
# This is the released run as it was made: every pass gradient-checkpointed and the classic LoRA form.  The two
# faster settings of phase 2 (ckpt_policy: auto, lora_fused: 1, 2 per pass x 8) compute the same gradients up to
# float rounding and can be used from step 0.
max_steps: 10000
batch_per_gpu: 4
grad_accum: 4
backbone_lr: 5.0e-5
adapter_mult: 6.0
warmup_steps: 300
min_lr_ratio: 0.2
weight_decay: 1.0e-4
grad_clip: 0.5
ema_decay: 0.9995
rollout_steps: 5
rescale_t: 3.0
grid_jitter: 0.15
k0_stay_p: 0.25
noise_layout_early_k: 2
cfg_dropout: 0.0           # no unconditional branch: guidance is folded into the turbo LoRAs
coarse_boost: 0.5
cam_weight: 0.2
feat_weight: 0.2
feat_cos_weight: 0.15
anchor_p: 0.12
uniform_coarse_p: 0.10
budget_p: 0.65
random_placement_p: 0.15
num_workers: 6
log_every: 20
save_every: 500
snapshot_every: 2500
ckpt_policy: always
lora_fused: 0
